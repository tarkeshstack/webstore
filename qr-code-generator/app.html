<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Arabic:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+Bengali:wght@400;500&family=Noto+Sans+Tamil:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{
    --bg:#DCE9F2;
    --panel:#BFDBEC;
    --panel-border:#E4E4E7;
    --accent:#C8842A;
    --accent-dim:#E9C793;
    --border-accent:#9AD8EF;
    --text:#17181C;
    --muted:#8A8D97;
    --danger:#C0362C;
    --field:#FFFFFF;
  }
  body.dark{
    --bg:linear-gradient(160deg,#0E0F12 0%,#16171C 55%,#1B1B22 100%);
    --panel:#16171C;
    --panel-border:#262832;
    --accent:#E8A33D;
    --accent-dim:#7A5A26;
    --border-accent:#7FC6E8;
    --text:#EDEDEF;
    --muted:#8A8D97;
    --danger:#E2574C;
    --field:#1D1F26;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
    transition:background .15s ease, color .15s ease;
  }
  .wrap{max-width:920px;margin:0 auto;}

  .topbar{position:relative;display:flex;align-items:center;justify-content:flex-end;margin-bottom:36px;padding-top:4px;}
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(28px,6vw,38px);
    letter-spacing:-0.02em;
    margin:0;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
  }
  h1 .qr-part{color:var(--accent);}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;
    border:none;background:var(--panel);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--text);flex-shrink:0;padding:0;
  }
  .icon-btn svg{width:16px;height:16px;}
  .icon-btn:hover{border-color:var(--accent-dim);}
  .theme-toggle .sun{display:none;}
  body.dark .theme-toggle .moon{display:none;}
  body.dark .theme-toggle .sun{display:block;}

  .layout{display:flex;flex-direction:column;gap:20px;}
  @media(min-width:760px){
    .layout{flex-direction:row;align-items:flex-start;}
    .preview-col{position:sticky;top:20px;flex:0 0 320px;}
    .controls-col{flex:1;min-width:0;}
  }

  .card{
    background:var(--panel);
    border:none;
    border-radius:14px;
    padding:18px;
    transition:background .15s ease, border-color .15s ease;
  }

  .preview-col .card{display:flex;flex-direction:column;align-items:center;gap:12px;}

  .preview-top{display:flex;align-items:center;justify-content:space-between;width:100%;}
  .swatch-group{display:flex;gap:8px;}
  .swatch{
    width:26px;height:26px;border-radius:50%;border:none;
    padding:0;cursor:pointer;box-shadow:inset 0 0 0 2px var(--panel);
  }
  .action-group{display:flex;gap:6px;}

  canvas{
    width:100%;
    max-width:280px;
    height:auto;
    border-radius:8px;
    display:block;
    image-rendering:pixelated;
    background:#fff;
    border:none;
  }

  .field-group{margin-bottom:14px;}
  .field-group:last-child{margin-bottom:0;}

  .content-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .content-head label{font-size:13px;font-weight:500;color:var(--text);margin-right:2px;}
  .lang-select{
    background:var(--field);border:1px solid var(--panel-border);color:var(--text);
    border-radius:16px;padding:5px 22px 5px 10px;font-size:12px;font-family:inherit;cursor:pointer;
  }
  .platform-btn{
    width:30px;height:30px;border-radius:50%;border:none;
    background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;
    transition:transform .08s ease;
  }
  .platform-btn svg{width:22px;height:22px;}
  .platform-btn:hover{transform:scale(1.08);}

  .platform-hint{
    display:none;align-items:center;gap:8px;background:var(--accent-dim);
    color:var(--text);font-size:12px;line-height:1.45;border-radius:8px;
    padding:8px 10px;margin-bottom:10px;
  }
  body.dark .platform-hint{background:#2A2110;}
  .platform-hint.show{display:flex;}
  .platform-hint span{flex:1;}
  .platform-hint button{
    background:none;border:none;color:var(--muted);font-size:16px;line-height:1;
    cursor:pointer;padding:0 2px;flex-shrink:0;
  }

  .input-wrap{position:relative;}
  textarea{
    width:100%;background:var(--field);border:none;
    color:var(--text);border-radius:9px;padding:11px 42px 11px 12px;font-size:15px;
    resize:vertical;min-height:88px;
  }
  textarea:focus{outline:none;border-color:var(--accent-dim);}
  .mic-btn{
    position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;
    border:none;background:var(--field);cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;color:var(--text);
  }
  .mic-btn svg{width:14px;height:14px;}
  .mic-btn.listening{background:var(--danger);border-color:var(--danger);color:#fff;}

  .error-msg{
    display:none;background:#FBE4E1;border:1px solid #F1B3AC;color:var(--danger);
    font-size:13px;border-radius:9px;padding:10px 12px;margin-top:10px;line-height:1.5;
  }
  body.dark .error-msg{background:#2A1614;border-color:#4A2420;}
  .error-msg.show{display:block;}

  /* ---- custom gradient color picker ---- */
  .picker-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .picker-overlay.show{display:flex;}
  .picker-panel{
    background:var(--panel);border:2px solid #000;border-radius:16px;padding:18px;
    width:100%;max-width:300px;
  }
  .picker-sv{
    width:100%;height:160px;border-radius:10px;cursor:crosshair;display:block;
    border:1px solid var(--panel-border);
  }
  .picker-cursor{
    position:absolute;width:14px;height:14px;border-radius:50%;
    border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6);
    transform:translate(-50%,-50%);pointer-events:none;
  }
  .picker-sv-wrap{position:relative;margin-bottom:14px;}
  .hue-slider{
    -webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:7px;
    background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
    margin-bottom:14px;
  }
  .hue-slider::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:#fff;border:2px solid #000;cursor:pointer;
  }
  .hue-slider::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #000;cursor:pointer;
  }
  .picker-footer{display:flex;align-items:center;gap:12px;}
  .picker-preview{width:34px;height:34px;border-radius:50%;border:2px solid #000;flex-shrink:0;}
  .picker-hex{
    flex:1;background:var(--field);border:1px solid var(--panel-border);color:var(--text);
    border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;
  }
  .picker-done{
    background:var(--accent);color:#1A1200;border:none;border-radius:8px;
    padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;
  }

  .history-wrap{max-width:920px;margin:20px auto 0;}
  .history-label{font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:500;}
  .history-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .history-item{
    width:44px;height:44px;border-radius:8px;border:none;
    cursor:pointer;flex-shrink:0;background:#fff;padding:3px;
  }
  .history-item canvas{width:100%;height:100%;image-rendering:pixelated;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1><span class="qr-part">QR</span>ify</h1>
    <button class="icon-btn theme-toggle" id="themeToggle" type="button" title="Toggle theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.5A9 9 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
    </button>
  </div>

  <div class="layout">
    <div class="preview-col">
      <div class="card">
        <div class="preview-top">
          <div class="swatch-group">
            <button class="swatch" id="fgSwatch" type="button" title="Dot color"></button>
            <button class="swatch" id="bgSwatch" type="button" title="Background color"></button>
          </div>
          <div class="action-group">
            <button class="icon-btn" id="downloadBtn" type="button" title="Download">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 19h16"/></svg>
            </button>
            <button class="icon-btn" id="shareBtn" type="button" title="Share">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="2.4"/><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="19" r="2.4"/><path d="M8.2 10.8 15.8 6.3M8.2 13.2l7.6 4.5"/></svg>
            </button>
          </div>
        </div>
        <canvas id="qrCanvas" width="280" height="280"></canvas>
        <div id="qrCaption" style="font-size:11.5px;color:var(--muted);text-align:center;max-width:260px;word-break:break-word;line-height:1.4;"></div>
      </div>
    </div>

    <div class="controls-col">
      <div class="card">
        <div class="field-group">
          <div class="content-head">
            <label>Content</label>
            <select id="langSelect" class="lang-select">
              <option value="en" data-font="'Inter',sans-serif" data-dir="ltr" selected>EN</option>
              <option value="hi" data-font="'Noto Sans Devanagari',sans-serif" data-dir="ltr">हिन्दी</option>
              <option value="ar" data-font="'Noto Sans Arabic',sans-serif" data-dir="rtl">العربية</option>
              <option value="zh" data-font="'Noto Sans SC',sans-serif" data-dir="ltr">中文</option>
              <option value="ja" data-font="'Noto Sans JP',sans-serif" data-dir="ltr">日本語</option>
              <option value="ko" data-font="'Noto Sans KR',sans-serif" data-dir="ltr">한국어</option>
              <option value="bn" data-font="'Noto Sans Bengali',sans-serif" data-dir="ltr">বাংলা</option>
              <option value="ta" data-font="'Noto Sans Tamil',sans-serif" data-dir="ltr">தமிழ்</option>
              <option value="ru" data-font="'Noto Sans',sans-serif" data-dir="ltr">Русский</option>
              <option value="es" data-font="'Inter',sans-serif" data-dir="ltr">Español</option>
              <option value="fr" data-font="'Inter',sans-serif" data-dir="ltr">Français</option>
              <option value="de" data-font="'Inter',sans-serif" data-dir="ltr">Deutsch</option>
            </select>
            <button class="platform-btn" data-url="https://www.youtube.com" title="YouTube">
              <svg viewBox="0 0 24 24"><rect x="2" y="5.5" width="20" height="13" rx="4" fill="#FF0000"/><path d="M10.5 9.2v5.6l5-2.8-5-2.8Z" fill="#fff"/></svg>
            </button>
            <button class="platform-btn" data-url="https://www.linkedin.com" title="LinkedIn">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="#0A66C2"/><circle cx="7.2" cy="8" r="1.1" fill="#fff"/><path d="M7.2 11v6M11 17v-3.6c0-1.6 1.2-2.4 2.4-2.4 1.2 0 2.1.8 2.1 2.4V17M11 11v6" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
            </button>
            <button class="platform-btn" data-url="https://www.instagram.com" title="Instagram">
              <svg viewBox="0 0 24 24"><defs><linearGradient id="igGrad" x1="0" y1="24" x2="24" y2="0"><stop offset="0" stop-color="#FEDA75"/><stop offset=".35" stop-color="#D62976"/><stop offset=".7" stop-color="#962FBF"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="5.5" fill="url(#igGrad)"/><circle cx="12" cy="12" r="4" stroke="#fff" stroke-width="1.7" fill="none"/><circle cx="17.2" cy="6.8" r="1" fill="#fff"/></svg>
            </button>
            <button class="platform-btn" data-url="https://www.facebook.com" title="Facebook">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#1877F2"/><path d="M14 8.5h-1.6c-.9 0-1.4.6-1.4 1.5V11h3l-.4 3h-2.6v6.4M10.4 21v-6.5H8V11h2.4" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="platform-btn" data-url="https://www.amazon.com" title="Amazon">
              <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="#131921"/><path d="M6.5 9l1.1 6.4a1.6 1.6 0 0 0 1.6 1.3h5.6a1.6 1.6 0 0 0 1.6-1.3L17.5 9" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M9.8 9V7.2a2.2 2.2 0 0 1 4.4 0V9" stroke="#fff" stroke-width="1.5" fill="none"/><path d="M6.2 17.8c2.4 1.5 9.2 1.5 11.6 0" stroke="#FF9900" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="platform-hint" id="platformHint">
            <span id="platformHintText"></span>
            <button id="platformHintClose" type="button" aria-label="Dismiss">&times;</button>
          </div>
          <div class="input-wrap">
            <textarea id="dataInput" placeholder="https://...">https://claude.ai</textarea>
            <button class="mic-btn" id="micBtn" type="button" title="Voice input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
          </div>
          <div class="error-msg" id="errorMsg"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="history-wrap" id="historyWrap" style="display:none;">
    <div class="history-label">Recent</div>
    <div class="history-row" id="historyRow"></div>
  </div>
</div>

<div class="picker-overlay" id="pickerOverlay">
  <div class="picker-panel">
    <div class="picker-sv-wrap">
      <canvas class="picker-sv" id="svCanvas" width="264" height="160"></canvas>
      <div class="picker-cursor" id="pickerCursor"></div>
    </div>
    <input type="range" class="hue-slider" id="hueSlider" min="0" max="359" value="0">
    <div class="picker-footer">
      <div class="picker-preview" id="pickerPreview"></div>
      <input class="picker-hex" id="pickerHex" value="#000000" spellcheck="false">
      <button class="picker-done" id="pickerDone" type="button">Done</button>
    </div>
  </div>
</div>

<script>
(function(){
  const dataInput = document.getElementById('dataInput');
  const canvas = document.getElementById('qrCanvas');
  const ctx = canvas.getContext('2d');
  const downloadBtn = document.getElementById('downloadBtn');
  const shareBtn = document.getElementById('shareBtn');
  const errorMsg = document.getElementById('errorMsg');
  const qrCaption = document.getElementById('qrCaption');
  const themeToggle = document.getElementById('themeToggle');
  const langSelect = document.getElementById('langSelect');
  const micBtn = document.getElementById('micBtn');
  const fgSwatch = document.getElementById('fgSwatch');
  const bgSwatch = document.getElementById('bgSwatch');

  const colors = { fg:'#000000', bg:'#ffffff' };
  let debounceTimer = null;

  function scheduleRender(){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 120);
  }

  function updateSwatches(){
    fgSwatch.style.background = colors.fg;
    bgSwatch.style.background = colors.bg;
  }
  updateSwatches();

  themeToggle.addEventListener('click', ()=>{
    document.body.classList.toggle('dark');
  });

  function applyLanguage(){
    const opt = langSelect.selectedOptions[0];
    dataInput.style.fontFamily = opt.dataset.font;
    dataInput.dir = opt.dataset.dir;
    dataInput.lang = opt.value;
  }
  langSelect.addEventListener('change', applyLanguage);
  applyLanguage();

  const PLATFORM_HINTS = {
    'https://www.youtube.com':   'YouTube: tap Share below the video → Copy link, then hit Paste here.',
    'https://www.linkedin.com':  'LinkedIn: tap ⋯ (or Share) on the post/profile → Copy link, then hit Paste here.',
    'https://www.instagram.com': 'Instagram: tap the share icon (or ⋯) → Copy Link, then hit Paste here.',
    'https://www.facebook.com':  'Facebook: tap Share below the post → Copy link, then hit Paste here.',
    'https://www.amazon.com':    'Amazon: tap the share icon on the product page → Copy Link, then hit Paste here.'
  };
  const platformHint = document.getElementById('platformHint');
  const platformHintText = document.getElementById('platformHintText');
  const platformHintClose = document.getElementById('platformHintClose');
  let hintTimer = null;

  function showPlatformHint(webUrl){
    const msg = PLATFORM_HINTS[webUrl];
    if(!msg) return;
    platformHintText.textContent = msg;
    platformHint.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(()=> platformHint.classList.remove('show'), 8000);
  }
  platformHintClose.addEventListener('click', ()=>{
    clearTimeout(hintTimer);
    platformHint.classList.remove('show');
  });

  document.querySelectorAll('.platform-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      window.open(btn.dataset.url, '_blank', 'noopener');
      showPlatformHint(btn.dataset.url);
    });
  });

  // ---- voice input (Web Speech API, browser-only) ----
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SR){
    const recognition = new SR();
    recognition.continuous = false;
    recognition.interimResults = false;
    let listening = false;

    micBtn.addEventListener('click', ()=>{
      if(listening){ recognition.stop(); return; }
      recognition.lang = langSelect.value === 'en' ? 'en-US' : langSelect.value;
      try{ recognition.start(); }catch(e){}
    });
    recognition.onstart = ()=>{ listening = true; micBtn.classList.add('listening'); };
    recognition.onend = ()=>{ listening = false; micBtn.classList.remove('listening'); };
    recognition.onerror = ()=>{ listening = false; micBtn.classList.remove('listening'); };
    recognition.onresult = (e)=>{
      const transcript = e.results[0][0].transcript;
      dataInput.value = (dataInput.value.trim() ? dataInput.value.trim() + ' ' : '') + transcript;
      render();
    };
  } else {
    micBtn.style.display = 'none';
  }

  dataInput.addEventListener('input', scheduleRender);

  function inFinder(r,c,count){
    return (r<8 && c<8) || (r<8 && c>=count-8) || (r>=count-8 && c<8);
  }

  function render(){
    errorMsg.classList.remove('show');
    const text = dataInput.value.trim();
    if(!text){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      qrCaption.textContent = '';
      return;
    }

    let qr;
    try{
      qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
    }catch(err){
      errorMsg.textContent = 'Too long to encode. Try a shorter link or text.';
      errorMsg.classList.add('show');
      qrCaption.textContent = '';
      return;
    }

    qrCaption.textContent = text;
    scheduleHistoryPush(text);

    const count = qr.getModuleCount();
    const quiet = 4;
    const moduleSize = 10;
    const size = (count + quiet*2) * moduleSize;
    canvas.width = size;
    canvas.height = size;

    ctx.clearRect(0,0,size,size);
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0,0,size,size);
    ctx.fillStyle = colors.fg;

    for(let r=0;r<count;r++){
      for(let c=0;c<count;c++){
        if(!qr.isDark(r,c)) continue;
        const x = (quiet+c)*moduleSize;
        const y = (quiet+r)*moduleSize;
        ctx.fillRect(x,y,moduleSize,moduleSize);
      }
    }
  }

  downloadBtn.addEventListener('click', ()=>{
    const link = document.createElement('a');
    link.download = 'qr-code.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  shareBtn.addEventListener('click', async ()=>{
    canvas.toBlob(async (blob)=>{
      if(!blob) return;
      const file = new File([blob], 'qr-code.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file]});
        }catch(e){ /* user cancelled */ }
      } else if(navigator.share){
        try{
          await navigator.share({text: dataInput.value.trim()});
        }catch(e){ /* user cancelled */ }
      } else {
        downloadBtn.click();
      }
    }, 'image/png');
  });

  // =========================================================
  // Custom gradient (HSV) color picker — replaces native <input type=color>
  // =========================================================
  const pickerOverlay = document.getElementById('pickerOverlay');
  const svCanvas = document.getElementById('svCanvas');
  const svCtx = svCanvas.getContext('2d');
  const hueSlider = document.getElementById('hueSlider');
  const pickerCursor = document.getElementById('pickerCursor');
  const pickerPreview = document.getElementById('pickerPreview');
  const pickerHex = document.getElementById('pickerHex');
  const pickerDone = document.getElementById('pickerDone');

  let activeTarget = null; // 'fg' or 'bg'
  let hue = 0, satPos = 0, valPos = 0; // satPos/valPos as 0..1 fractions within the square

  function hsvToHex(h,s,v){
    const c = v*s, x = c*(1-Math.abs((h/60)%2-1)), m = v-c;
    let r,g,b;
    if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
    else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
    const toHex = n => Math.round((n+m)*255).toString(16).padStart(2,'0');
    return '#'+toHex(r)+toHex(g)+toHex(b);
  }

  function hexToHsv(hex){
    const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max-min;
    let h = 0;
    if(d!==0){
      if(max===r) h = 60*(((g-b)/d)%6);
      else if(max===g) h = 60*((b-r)/d+2);
      else h = 60*((r-g)/d+4);
    }
    if(h<0) h+=360;
    const s = max===0 ? 0 : d/max;
    const v = max;
    return {h,s,v};
  }

  function drawSV(){
    const w = svCanvas.width, h = svCanvas.height;
    svCtx.fillStyle = `hsl(${hue},100%,50%)`;
    svCtx.fillRect(0,0,w,h);
    const whiteGrad = svCtx.createLinearGradient(0,0,w,0);
    whiteGrad.addColorStop(0,'rgba(255,255,255,1)');
    whiteGrad.addColorStop(1,'rgba(255,255,255,0)');
    svCtx.fillStyle = whiteGrad;
    svCtx.fillRect(0,0,w,h);
    const blackGrad = svCtx.createLinearGradient(0,0,0,h);
    blackGrad.addColorStop(0,'rgba(0,0,0,0)');
    blackGrad.addColorStop(1,'rgba(0,0,0,1)');
    svCtx.fillStyle = blackGrad;
    svCtx.fillRect(0,0,w,h);
  }

  function positionCursor(){
    const rect = svCanvas.getBoundingClientRect();
    pickerCursor.style.left = (satPos*rect.width)+'px';
    pickerCursor.style.top = (valPos*rect.height)+'px';
  }

  function currentHex(){
    return hsvToHex(hue, satPos, 1-valPos);
  }

  function updatePreview(){
    const hex = currentHex();
    pickerPreview.style.background = hex;
    pickerHex.value = hex;
  }

  function applyLive(){
    const hex = currentHex();
    if(activeTarget) colors[activeTarget] = hex;
    updateSwatches();
    scheduleRender();
  }

  function openPicker(target){
    activeTarget = target;
    const hsv = hexToHsv(colors[target]);
    hue = hsv.h; satPos = hsv.s; valPos = 1-hsv.v;
    hueSlider.value = Math.round(hue);
    drawSV();
    updatePreview();
    pickerOverlay.classList.add('show');
    requestAnimationFrame(positionCursor);
  }

  fgSwatch.addEventListener('click', ()=>openPicker('fg'));
  bgSwatch.addEventListener('click', ()=>openPicker('bg'));

  pickerOverlay.addEventListener('click', (e)=>{
    if(e.target === pickerOverlay) pickerOverlay.classList.remove('show');
  });
  pickerDone.addEventListener('click', ()=> pickerOverlay.classList.remove('show'));

  hueSlider.addEventListener('input', ()=>{
    hue = parseInt(hueSlider.value,10);
    drawSV();
    updatePreview();
    applyLive();
  });

  let dragging = false;
  function pointerToSV(clientX, clientY){
    const rect = svCanvas.getBoundingClientRect();
    let x = (clientX-rect.left)/rect.width;
    let y = (clientY-rect.top)/rect.height;
    x = Math.max(0,Math.min(1,x));
    y = Math.max(0,Math.min(1,y));
    satPos = x; valPos = y;
    pickerCursor.style.left = (x*rect.width)+'px';
    pickerCursor.style.top = (y*rect.height)+'px';
    updatePreview();
    applyLive();
  }
  svCanvas.addEventListener('pointerdown', (e)=>{ dragging = true; pointerToSV(e.clientX, e.clientY); });
  window.addEventListener('pointermove', (e)=>{ if(dragging) pointerToSV(e.clientX, e.clientY); });
  window.addEventListener('pointerup', ()=>{ dragging = false; });

  pickerHex.addEventListener('change', ()=>{
    let v = pickerHex.value.trim();
    if(!/^#[0-9a-fA-F]{6}$/.test(v)) { pickerHex.value = currentHex(); return; }
    const hsv = hexToHsv(v);
    hue = hsv.h; satPos = hsv.s; valPos = 1-hsv.v;
    hueSlider.value = Math.round(hue);
    drawSV();
    positionCursor();
    updatePreview();
    applyLive();
  });

  // =========================================================
  // History — last 5 generated codes, kept small at the bottom
  // =========================================================
  const historyWrap = document.getElementById('historyWrap');
  const historyRow = document.getElementById('historyRow');
  const history = [];
  let historyTimer = null;

  function scheduleHistoryPush(text){
    clearTimeout(historyTimer);
    historyTimer = setTimeout(()=> pushHistory(text), 1500);
  }

  function pushHistory(text){
    if(history.length && history[history.length-1].text === text) return;
    history.push({ text, fg: colors.fg, bg: colors.bg });
    if(history.length > 5) history.shift();
    renderHistory();
  }

  function renderHistory(){
    historyRow.innerHTML = '';
    if(!history.length){ historyWrap.style.display = 'none'; return; }
    historyWrap.style.display = 'block';
    // most recent first
    for(let i = history.length - 1; i >= 0; i--){
      const item = history[i];
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'history-item';
      cell.title = item.text;
      const c = document.createElement('canvas');
      cell.appendChild(c);
      historyRow.appendChild(cell);
      drawThumb(c, item);
      cell.addEventListener('click', ()=>{
        dataInput.value = item.text;
        colors.fg = item.fg; colors.bg = item.bg;
        updateSwatches();
        render();
      });
    }
  }

  function drawThumb(c, item){
    try{
      const q = qrcode(0,'M');
      q.addData(item.text);
      q.make();
      const n = q.getModuleCount();
      const px = 4, quiet = 1;
      const s = (n + quiet*2) * px;
      c.width = s; c.height = s;
      const tctx = c.getContext('2d');
      tctx.fillStyle = item.bg;
      tctx.fillRect(0,0,s,s);
      tctx.fillStyle = item.fg;
      for(let r=0;r<n;r++){
        for(let col=0;col<n;col++){
          if(q.isDark(r,col)) tctx.fillRect((quiet+col)*px,(quiet+r)*px,px,px);
        }
      }
    }catch(e){ /* skip thumb on encode failure */ }
  }

  render();
})();
</script>
</body>
</html>
